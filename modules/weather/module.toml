manifest_version = 1

[module]
name = "weather"
version = "0.1.0"
summary = "Current conditions and a short forecast for anywhere in the world."
phrases = [
    "weather",
    "forecast",
    "temperature",
    "degrees",
    "rain",
    "snow",
    "wind",
    "sunny",
    "cloudy",
    "humid",
    "umbrella",
    "how hot",
    "how cold",
    "how warm",
]

[grants]
egress = ["geocoding-api.open-meteo.com", "api.open-meteo.com"]
timeout_seconds = 10
consequence = "read-only"
confirm = false

[settings]
units = "metric"
