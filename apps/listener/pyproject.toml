[project]
name = "ollie-listener"
version = "0.1.0"
description = "Voice assistant: hears a wake word, answers out loud, all on-device"
requires-python = ">=3.10,<3.13"
dependencies = [
    "openai-whisper>=20240930",
    "piper-tts>=1.8",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "textual>=0.50",
    "torch>=2.2",
]

[tool.uv]
package = false
