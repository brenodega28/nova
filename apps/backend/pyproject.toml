[project]
name = "ollie-listener"
version = "0.1.0"
description = "Voice assistant: hears a wake word, answers out loud, all on-device"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai-whisper>=20240930",
    "piper-tts>=1.8",
    "nova-sdk",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pydantic-settings>=2.4",
    "pydantic>=2.8",
    "textual>=0.50",
    "torch>=2.2",
]

[tool.uv]
package = false

[tool.uv.sources]
nova-sdk = { path = "../sdk", editable = true }
