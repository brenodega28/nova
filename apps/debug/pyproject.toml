[project]
name = "nova-debug"
version = "0.1.0"
description = "A terminal view into a running Nova backend: models, CPU, GPU, memory, and restarts."
requires-python = ">=3.11"
dependencies = [
    "psutil>=5.9",
    "textual>=0.50",
]

[project.scripts]
nova-debug = "debug.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debug"]
